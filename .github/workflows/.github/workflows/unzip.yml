name: Extract LISTIXAAR ZIP

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          set -e
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n1)"
          test -n "$ZIP"
          rm -rf /tmp/listixaar_extract
          mkdir -p /tmp/listixaar_extract
          unzip -q "$ZIP" -d /tmp/listixaar_extract
          ROOT="$(find /tmp/listixaar_extract -type f -name package.json -print -quit | xargs dirname)"
          cp -a "$ROOT"/. ./
          rm -rf "$ZIP" /tmp/listixaar_extract

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0 || true
          git commit -m "Extract LISTIXAAR project"
          git push
