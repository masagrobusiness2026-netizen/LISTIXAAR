services:
  - type: web
    name: listixaar-online
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: listixaar-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: PAYMENT_PROVIDER
        sync: false
      - key: MERCHANT_CODE
        sync: false
      - key: MERCHANT_PUBLIC_KEY
        sync: false
      - key: MERCHANT_SECRET_KEY
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false

databases:
  - name: listixaar-db
    databaseName: listixaar
    user: listixaar
